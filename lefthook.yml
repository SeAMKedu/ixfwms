# Same hooks on macOS, Windows and Linux. Skip once with LEFTHOOK=0 git commit ...
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,json,md,yml,yaml,css}'
      run: npx prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: npx eslint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    check:
      run: npm run check
