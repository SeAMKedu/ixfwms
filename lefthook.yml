# Same hooks on macOS, Windows and Linux. Skip once with LEFTHOOK=0 git commit ...
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,json,md,yml,yaml,css}'
      run: npx prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: npx eslint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

# After a merge or pull: did the docs keep up with what came in? Warns, can't undo the merge.
post-merge:
  commands:
    docs:
      run: node scripts/docs-check.mjs --since ORIG_HEAD

pre-push:
  commands:
    check:
      run: npm run check
