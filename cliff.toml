# git-cliff: changelog from Conventional Commits. Run via `npm run release`, which adds the new
# release on top of CHANGELOG.md and lists its database migrations under "Upgrading".
# A commit's `Upgrade:` footer (a step to take when upgrading) and breaking changes go there too.
[changelog]
header = "# Changelog\n\nAll notable changes to ixfwms.\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}{% endfor %}
{%- set_global upgrading = [] %}{% for commit in commits %}{% if commit.breaking %}{% set_global upgrading = upgrading | concat(with="**Breaking:** " ~ commit.breaking_description) %}{% endif %}{% for footer in commit.footers %}{% if footer.token == "Upgrade" %}{% set_global upgrading = upgrading | concat(with=footer.value) %}{% endif %}{% endfor %}{% endfor %}
{%- if upgrading | length > 0 %}
### Upgrading
{% for note in upgrading %}- {{ note }}
{% endfor %}{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|build|refactor|test|style)", group = "<!-- 4 -->Maintenance" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
